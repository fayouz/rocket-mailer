parameters:
    env(MAILER_DEFAULT_FROM): ''
    env(ATTACHMENTS_DIR): '%kernel.project_dir%/var/attachments'
    # Storage checked on the dashboard (rocket-core): the attachments' disk.
    env(DATA_DIR): '%env(ATTACHMENTS_DIR)%'
    env(ATTACHMENT_MAX_SIZE): '10485760'
    env(ATTACHMENTS_MAX_TOTAL_SIZE): '26214400'
    env(MAILBOX_ENCRYPTION_KEY): ''
    env(MAILBOX_TIMEOUT): '15'
    env(UPDATE_REPOSITORY): 'fayouz/rocket-mailer'
    env(DEMO_HOST_ORIGIN): 'http://localhost:4000'
    env(DEMO_MAILBOX_SMTP): ''
    env(DEMO_MAILBOX_IMAP): ''
    # Shared inboxes: largest message fetched (bytes), delay between two automatic fetches.
    env(INBOX_MAX_MESSAGE_SIZE): '26214400'
    env(INBOX_FETCH_INTERVAL): '5 minutes'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'

when@test:
    services:
        App\Tests\Support\HttpMock: ~
        # No network in the tests: scripted IMAP/SMTP servers, fixed MX records.
        App\Mailbox\MailServers:
            class: App\Tests\Support\FakeMailServers
            autowire: true
        App\Mailbox\MxResolver:
            class: App\Tests\Support\FakeMxResolver
