# Demo environment — see demo/README.md
#   docker compose -f compose.yaml -f compose.demo.yaml up -d --build
# Public URLs can be overridden with DEMO_HOST_ORIGIN / DEMO_MAILER_URL (see demo/codespaces/start.sh).
# Everything here is for local demos only: known passwords and a known application token.

x-demo-env: &demo-env
  DEMO_MODE: "1"
  DEMO_APP_TOKEN: &demo-token rma_demo_rocket_mailer_do_not_use_in_production
  DEMO_HOST_ORIGIN: ${DEMO_HOST_ORIGIN:-http://localhost:4000}
  LDAP_ENABLED: "1"
  LDAP_ADMIN_GROUP_DN: cn=mailer-admins,ou=groups,dc=example,dc=org
  CORS_ALLOW_ORIGIN: ^http://localhost:(3000|4000)$$

services:
  ldap:
    profiles: !reset []

  # One-shot: schema, demo data, then LDAP synchronization (retried while the directory boots).
  demo-seed:
    image: ${API_IMAGE:-rocket-mailer-api}
    build: ./backend
    environment:
      <<: *demo-env
      APP_ENV: prod
      APP_SECRET: demo
      JWT_PASSPHRASE: demo
      MAILER_DEFAULT_FROM: Rocket Mailer <no-reply@example.org>
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-app}@database:5432/app?serverVersion=16&charset=utf8
      LDAP_URL: ldap://ldap:389
      LDAP_BASE_DN: ou=people,dc=example,dc=org
      LDAP_SEARCH_DN: cn=admin,dc=example,dc=org
      LDAP_SEARCH_PASSWORD: adminpassword
    volumes:
      - jwt_keys:/app/config/jwt
    command:
      - sh
      - -c
      - |
        php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
        php bin/console app:demo:seed
        for i in $$(seq 1 30); do php bin/console app:ldap:sync && exit 0; echo "LDAP not ready, retrying…"; sleep 2; done
        exit 1
    depends_on:
      database:
        condition: service_healthy
      ldap:
        condition: service_started

  api:
    environment:
      <<: *demo-env
      APP_SECRET: demo
      JWT_PASSPHRASE: demo
      RUN_MIGRATIONS: "0"
    depends_on:
      demo-seed:
        condition: service_completed_successfully

  worker:
    environment:
      <<: *demo-env
      APP_SECRET: demo
      JWT_PASSPHRASE: demo
    depends_on:
      demo-seed:
        condition: service_completed_successfully

  # The browser only talks to the front, which proxies /api to the API: one public URL is enough
  # (Codespaces, tunnels…) and no CORS is involved.
  front:
    environment:
      NUXT_PUBLIC_API_BASE: ""

  demo-host:
    build: ./demo/host
    restart: unless-stopped
    environment:
      APP_TOKEN: *demo-token
      API_INTERNAL_URL: http://api:80
      MAILER_PUBLIC_URL: ${DEMO_MAILER_URL:-http://localhost:3000}
      DEMO_USERS: alice@example.org,jean.dupont@example.org,marie.martin@example.org,admin@example.org
    ports:
      - "4000:4000"
    depends_on:
      - api
      - front
