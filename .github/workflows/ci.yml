name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**', 'claude/**']
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The jobs are the reusable workflows of rocket-core, shared by every brick.
# The ref will become a version tag of rocket-core (e.g. @v1) once it is tagged.
jobs:
  backend:
    name: Backend (PHP)
    uses: fayouz/rocket-core/.github/workflows/brick-backend.yml@claude/practical-cray-rz3j2q
    with:
      # GreenMail (real SMTP + IMAP server) for the sending mailbox tests: .github/backend-setup.sh
      setup-script: .github/backend-setup.sh

  frontend:
    name: Frontend (Nuxt)
    uses: fayouz/rocket-core/.github/workflows/brick-frontend.yml@claude/practical-cray-rz3j2q

  docs:
    name: Docs (Nuxt Content)
    uses: fayouz/rocket-core/.github/workflows/brick-frontend.yml@claude/practical-cray-rz3j2q
    with:
      working-directory: docs
      build-script: generate

  integration-nuxt:
    name: Integration client (Nuxt layer)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/nuxt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/nuxt/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  integration-symfony:
    name: Integration client (Symfony bundle, PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.4']
    defaults:
      run:
        working-directory: integrations/symfony
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      # A library: resolved against the latest versions allowed by composer.json.
      - run: composer update --prefer-dist --no-progress --no-interaction
      - run: vendor/bin/phpunit

  images:
    name: Docker images
    needs: [backend, frontend]
    # Published to ghcr.io on main, develop and version tags.
    permissions:
      contents: read
      packages: write
    uses: fayouz/rocket-core/.github/workflows/brick-images.yml@claude/practical-cray-rz3j2q
    with:
      api-resource: /api/emails
      # The front serves the widget script (embed.js): .github/smoke-test.sh
      smoke-script: .github/smoke-test.sh

  demo:
    name: Demo environment (compose)
    needs: [backend, frontend]
    uses: fayouz/rocket-core/.github/workflows/brick-demo.yml@claude/practical-cray-rz3j2q
    with:
      front-url: http://localhost:3000
      docs-url: http://localhost:3001
      # Third-party host of the demo (Démo CRM)
      ready-urls: http://localhost:4000/
      # Scenarios of this brick: .github/demo-scenarios.sh
